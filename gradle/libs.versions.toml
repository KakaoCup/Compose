[versions]
dokkaGradlePluginVersion = "2.2.0"
githubApiVersion = "1.330"
gradle = "9.4.0"
kotlin = "2.4.10"
gradleVersion = "9.4.0"
compileSdk = "37"
targetSdk = "37"
minSdk = "23"
jvmVersion = "11"

dokkaVersion = "2.2.0"
appcompatVersion = "1.8.0"
